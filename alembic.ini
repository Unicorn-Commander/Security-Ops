# Alembic configuration — Security-Ops.
#
# The database URL is intentionally a placeholder here: migrations/env.py
# OVERRIDES sqlalchemy.url at runtime from app.core.config.settings.database_url
# (which honors SECOPS_DATABASE_URL / DATABASE_URL). Do not hardcode real
# credentials in this file.

[alembic]
# Location of the migration environment + versions/ (relative to repo root).
script_location = migrations

# Make the `app` package importable when running `alembic` from the repo root
# (env.py does `from app.db.base import Base` and `import app.models`).
prepend_sys_path = .

# Use the OS path separator for version file discovery.
version_path_separator = os

# Timezone for `alembic revision` timestamps (UTC to match the app's convention).
timezone = UTC

# Placeholder ONLY — replaced at runtime by migrations/env.py from settings.
sqlalchemy.url = driver://user:pass@localhost/dbname


# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
