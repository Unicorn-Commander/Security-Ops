# Security-Ops SPA — nginx server block (dropped at conf.d/default.conf, i.e.
# inside the http{} context). Serves the built Vite bundle and reverse-proxies
# /api to the FastAPI backend. MUST listen on 8131 (the frontend container port
# per docker-compose.yml / the blueprint). Mirrors frontend/vite.config.js: the
# /api prefix is preserved (the SPA's baseURL is /api/v1) — never stripped.

# Map for WebSocket / SSE upgrade forwarding (must live in the http context).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8131;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Reverse proxy to the API container (docker-compose service `secops-api`).
    # No trailing slash/URI on proxy_pass => the full original path (including the
    # /api prefix) is forwarded unchanged to the backend router.
    location /api/ {
        proxy_pass http://secops-api:8130;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long-lived autonomous runs stream progress (Phase 2 SSE); don't buffer
        # and allow WebSocket upgrades.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA history fallback: serve index.html for any non-file route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
