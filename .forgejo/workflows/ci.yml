name: CI
# Security-Ops had no CI at all until 2026-10-23 (PR #5 and #6 merged on local runs). Same runner label as the
# sibling apps. The unit suite runs on in-memory aiosqlite (see requirements-dev.txt); the Postgres RLS suite is
# skipped unless SECOPS_TEST_DATABASE_URL is set.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip check

      - name: Unit suite + import check
        run: |
          python -m compileall -q app
          python -m pytest -q

      - name: Alembic has exactly one head
        run: |
          heads="$(python -m alembic heads | grep -c '(head)' || true)"
          echo "alembic heads: $heads"
          test "$heads" = "1"
